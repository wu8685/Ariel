apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ariel-relay
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ariel.example.com
      secretName: ariel-tls
  rules:
    - host: ariel.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ariel-relay
                port:
                  name: http
